
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kế Hoạch Đào Tạo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --teacher-color: #0b694a;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 20px;
            font-size: 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* --- HEADER & NAVBAR --- */
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--secondary-color); margin-bottom: 30px; padding: 0 10px 0 20px;
            border-radius: 8px;
        }
        .logo-box { display: flex; align-items: center; }
        .logo-img { height: 45px; object-fit: contain; margin: 10px 0; }
        .nav-menu { display: flex; list-style: none; height: 100%; }
        .nav-item {
            text-decoration: none; color: #333; padding: 22px 25px; font-weight: 500; font-size: 15px;
            transition: background-color 0.2s; border-bottom: 3px solid transparent; display: flex; align-items: center;
        }
        .nav-item:hover { background-color: #e2e8f0; }
        .nav-item.active { background-color: #ffffff; border-bottom: 3px solid #000000; font-weight: bold; }

        .header-title {
            text-align: center; color: var(--primary-color); margin-bottom: 25px;
            font-size: 22px; text-transform: uppercase; font-weight: 700;
        }

        /* --- VÙNG LỌC DỮ LIỆU --- */
        .filter-section {
            display: flex; gap: 20px; margin-bottom: 25px; background: var(--secondary-color);
            padding: 20px; border-radius: 8px; align-items: flex-end; flex-wrap: wrap;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
        .filter-group label { font-weight: 600; color: #4a5568; font-size: 13px; text-transform: uppercase; }
        .filter-group select {
            padding: 10px 12px; border-radius: 4px; border: 1px solid #cbd5e0; outline: none;
            font-size: 14px; width: 100%; cursor: pointer; background-color: white;
        }
        .filter-group select:focus { border-color: var(--primary-color); }

        /* --- BẢNG DỮ LIỆU --- */
        .table-responsive { 
            overflow-x: auto; 
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            -webkit-overflow-scrolling: touch; /* Hỗ trợ vuốt mượt trên iOS */
        }
        
        table { width: 100%; border-collapse: collapse; background-color: white; min-width: 900px; }
        thead { background-color: var(--primary-color); color: white; }
        th, td { padding: 14px 15px; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; text-align: center; white-space: nowrap; }
        
        /* Căn chỉnh các cột */
        td { font-size: 14px; }
        th:nth-child(2), td:nth-child(2), /* Khối KT */
        th:nth-child(3), td:nth-child(3), /* Mã HP */
        th:nth-child(4), td:nth-child(4), /* Tên HP */
        th:nth-child(6), td:nth-child(6)  /* Khoa QL */
        { text-align: left; }

        /* Cố định cột STT và Tên học phần khi vuốt ngang trên điện thoại */
        @media (max-width: 1024px) {
            th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; background-color: inherit; z-index: 2; border-right: 1px solid #e2e8f0; }
            th:nth-child(1) { background-color: var(--primary-color); color: white; border-right: none;}
        }

        tbody tr { background-color: #ffffff; transition: background-color 0.2s ease; }
        tbody tr:nth-child(even) { background-color: #fbfbfb; }
        tbody tr:hover { background-color: #f1f5f9; }

        .empty-message { text-align: center; padding: 40px; color: #718096; font-style: italic; }

        .badge {
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; white-space: nowrap;
        }
        .badge-success { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .badge-pending { background-color: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }

        #loading { text-align: center; padding: 20px; color: var(--primary-color); font-weight: bold; font-size: 16px; display: none; }
        #sync-indicator { text-align: center; font-size: 12px; color: #718096; margin-top: 20px; font-style: italic; }

        /* --- MOBILE TWEAKS --- */
        @media (max-width: 768px) {
            .top-navbar { flex-direction: column; padding: 15px; gap: 15px; }
            .nav-menu { width: 100%; justify-content: space-around; }
            .nav-item { padding: 10px; font-size: 14px; }
            .filter-section { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER NAVBAR -->
        <div class="top-navbar">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/khcbvadl-ai/quanlidulieu/main/logo.%20KHCB%20trong.png" alt="KHCB LOGO" class="logo-img">
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">Trang chủ</a>
                <a href="#" class="nav-item active">Lịch giảng</a>
                <a href="#" class="nav-item">Video bài giảng</a>
            </div>
        </div>

        <h2 class="header-title"><i class="fa-solid fa-book-open"></i> KẾ HOẠCH ĐÀO TẠO KHOA</h2>

        <!-- BỘ LỌC -->
        <div class="filter-section">
            
            <div class="filter-group">
                <label for="filter-cohort"><i class="fa-solid fa-graduation-cap"></i> Khóa tuyển sinh:</label>
                <select id="filter-cohort" onchange="applyFilter()">
                    <!-- Dropdown sẽ hiển thị dựa vào dữ liệu -->
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-ki"><i class="fa-solid fa-list-ol"></i> Kì học:</label>
                <select id="filter-ki" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả kì học --</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-khoa"><i class="fa-solid fa-building-user"></i> Khoa quản lí:</label>
                <select id="filter-khoa" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả các Khoa --</option>
                </select>
            </div>
        </div>

        <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>

        <!-- BẢNG HIỂN THỊ DỮ LIỆU -->
        <div class="table-responsive">
            <table id="schedule-table" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 50px;">STT</th>
                        <th>KHỐI KT</th>
                        <th>MÃ HP</th>
                        <th>TÊN HỌC PHẦN</th>
                        <th style="text-align: center;">KÌ HỌC</th>
                        <th>KHOA QUẢN LÍ</th>
                        <th style="text-align: center;">TÌNH TRẠNG</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu từ Sheet sẽ được vẽ vào đây -->
                </tbody>
            </table>
        </div>
        
        <div id="sync-indicator"></div>
    </div>

    <script>
        const SHEET_ID = "1zBWVtpmygOEgq-5AlM4V9N02twcp9Moi";
        const GID = "1909578552"; 
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
        
        // Đã cập nhật V5 để xóa bộ nhớ đệm lỗi của phiên bản trước
        const CACHE_KEY = "TRAINING_PLAN_CACHE_V5"; 

        let allPlanData = [];
        let availableCohorts = [];

        window.onload = function() {
            const cachedDataString = localStorage.getItem(CACHE_KEY);
            const cachedCohortsString = localStorage.getItem(CACHE_KEY + "_COHORTS");
            let hasCache = false;

            if (cachedDataString && cachedCohortsString) {
                try {
                    allPlanData = JSON.parse(cachedDataString);
                    availableCohorts = JSON.parse(cachedCohortsString);
                    hasCache = true;
                    
                    document.getElementById('schedule-table').style.display = 'table';
                    populateFilterDropdowns();
                    applyFilter();
                    
                    document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Đang kiểm tra dữ liệu mới...';
                } catch (e) {
                    console.error("Lỗi đọc cache:", e);
                }
            }

            fetchDataFromSheet(hasCache);
        };

        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        function fetchDataFromSheet(isBackgroundSync) {
            if (!isBackgroundSync) {
                document.getElementById('loading').style.display = 'block';
            }

            fetch(CSV_URL)
                .then(response => response.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let rawData = [];
                    let cohortsList = [];
                    let cohortIndices = {}; 
                    
                    for (let i = 0; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);
                        
                        // FIX TỌA ĐỘ MỚI CỦA CÁC CỘT SAU KHI CHÈN THÊM "KHỐI KIẾN THỨC"
                        // Nhận diện dòng tiêu đề bằng từ "HỌC PHẦN" ở cột thứ 4 (index 3)
                        if (cols.length > 3 && cols[3] && cols[3].trim().toUpperCase() === 'HỌC PHẦN') {
                            // Khóa tuyển sinh bắt đầu từ cột O (index 14) trở đi
                            for(let c = 14; c <= 25; c++) { 
                                if (c < cols.length) {
                                    let header = cols[c].trim();
                                    if(header && header !== "") {
                                        cohortsList.push(header);
                                        cohortIndices[header] = c; 
                                    }
                                }
                            }
                            continue;
                        }

                        // Quét Dòng dữ liệu (có số STT)
                        let stt = parseInt(cols[0]);
                        if (!isNaN(stt) && stt > 0) {
                            
                            // Tìm Kì học (Quét từ cột F->M / Index 5->12)
                            let kiHoc = "";
                            for(let k = 5; k <= 12; k++) {
                                if(k < cols.length && cols[k] && cols[k].trim() !== "") {
                                    kiHoc = cols[k].trim();
                                    break;
                                }
                            }
                            
                            let statuses = {};
                            cohortsList.forEach(year => {
                                let idx = cohortIndices[year];
                                let val = (idx < cols.length && cols[idx]) ? cols[idx].trim() : "";
                                statuses[year] = (val === "1") ? "Đã giảng dạy" : "Chưa giảng dạy";
                            });

                            rawData.push({
                                stt: stt,
                                khoiKienThuc: (cols.length > 1 && cols[1]) ? cols[1].trim() : "",
                                maHP: (cols.length > 2 && cols[2]) ? cols[2].trim() : "",
                                tenHP: (cols.length > 3 && cols[3]) ? cols[3].trim() : "",
                                kiHoc: kiHoc,
                                khoaQL: (cols.length > 13 && cols[13]) ? cols[13].trim() : "",
                                statuses: statuses
                            });
                        }
                    }

                    const newDataString = JSON.stringify(rawData);
                    const oldDataString = localStorage.getItem(CACHE_KEY);

                    if (newDataString !== oldDataString) {
                        localStorage.setItem(CACHE_KEY, newDataString);
                        localStorage.setItem(CACHE_KEY + "_COHORTS", JSON.stringify(cohortsList));
                        
                        allPlanData = rawData;
                        availableCohorts = cohortsList;
                        
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('schedule-table').style.display = 'table';
                        
                        let currentKi = document.getElementById('filter-ki').value;
                        let currentKhoa = document.getElementById('filter-khoa').value;
                        let currentCohort = document.getElementById('filter-cohort').value;
                        
                        populateFilterDropdowns();
                        
                        if(currentKi) document.getElementById('filter-ki').value = currentKi;
                        if(currentKhoa) document.getElementById('filter-khoa').value = currentKhoa;
                        if(currentCohort && availableCohorts.includes(currentCohort)) {
                            document.getElementById('filter-cohort').value = currentCohort;
                        }
                        
                        applyFilter();
                    } else if (!isBackgroundSync) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('schedule-table').style.display = 'table';
                    }
                    
                    document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-check-circle" style="color: green;"></i> Kế hoạch đào tạo đã được đồng bộ mới nhất';
                })
                .catch(err => {
                    console.error("Lỗi đồng bộ:", err);
                    if (!isBackgroundSync) {
                        document.getElementById('loading').innerHTML = '<span style="color:red">Lỗi tải dữ liệu. Vui lòng kiểm tra quyền truy cập link Google Sheet.</span>';
                    }
                    document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: orange;"></i> Đang dùng dữ liệu cũ (Ngoại tuyến)';
                });
        }

        function populateFilterDropdowns() {
            const kiSelect = document.getElementById('filter-ki');
            const khoaSelect = document.getElementById('filter-khoa');
            const cohortSelect = document.getElementById('filter-cohort');
            
            kiSelect.innerHTML = '<option value="ALL">-- Tất cả kì học --</option>';
            khoaSelect.innerHTML = '<option value="ALL">-- Tất cả các Khoa --</option>';
            cohortSelect.innerHTML = '';
            
            let kis = new Set();
            let khoas = new Set();

            allPlanData.forEach(item => {
                if (item.kiHoc) kis.add(parseInt(item.kiHoc));
                if (item.khoaQL) khoas.add(item.khoaQL);
            });

                 // Đổ danh sách Khóa tuyển sinh
            availableCohorts.forEach(year => {
                let option = document.createElement('option');
                option.value = year;
                option.textContent = "Khóa " + year;
                cohortSelect.appendChild(option);
            });
            
            // Đổ danh sách Kì học
            Array.from(kis).sort((a,b)=>a-b).forEach(k => {
                let option = document.createElement('option');
                option.value = k;
                option.textContent = "Kì " + k;
                kiSelect.appendChild(option);
            });

            // Đổ danh sách Khoa quản lí
            Array.from(khoas).sort((a,b) => a.localeCompare(b, 'vi')).forEach(khoa => {
                let option = document.createElement('option');
                option.value = khoa;
                option.textContent = khoa;
                khoaSelect.appendChild(option);
            });

          
        }

        function renderTable(dataArray, selectedCohort) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-message">Không tìm thấy dữ liệu học phần phù hợp</td></tr>';
                return;
            }

            dataArray.forEach((item, index) => {
                let statusText = item.statuses[selectedCohort] || "Chưa giảng dạy";
                let badgeClass = statusText === "Đã giảng dạy" ? "badge-success" : "badge-pending";

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; text-align: center;">${index + 1}</td>
                    <td style="color: #475569; font-style: italic;">${item.khoiKienThuc}</td>
                    <td style="font-weight: bold; color: var(--primary-color);">${item.maHP}</td>
                    <td style="font-weight: bold; font-size: 15px;">${item.tenHP}</td>
                    <td style="text-align: center; font-weight: bold;">${item.kiHoc}</td>
                    <td>${item.khoaQL}</td>
                    <td style="text-align: center;">
                        <span class="badge ${badgeClass}">${statusText}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilter() {
            let selectedKi = document.getElementById('filter-ki').value;
            let selectedKhoa = document.getElementById('filter-khoa').value;
            let selectedCohort = document.getElementById('filter-cohort').value;

            if (!selectedCohort) return;

            let filteredData = allPlanData.filter(item => {
                let matchKi = (selectedKi === "ALL") || (item.kiHoc == selectedKi);
                let matchKhoa = (selectedKhoa === "ALL") || (item.khoaQL === selectedKhoa);
                return matchKi && matchKhoa;
            });

            renderTable(filteredData, selectedCohort);
        }
    </script>
</body>
</html>
